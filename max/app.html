<!-- MAX UI's stylesheet and module are pinned to one release and checked
     against its hash, so a CDN serving anything else is refused. React and
     htm come from esm.sh, which builds per browser, so they carry no hash;
     ?external keeps react-dom importing the bare "react", which the import map
     resolves to the one copy MAX UI uses too — two Reacts on a page break
     hooks. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maxhub/max-ui@0.6.0/dist/styles.css"
      integrity="sha384-snTDiONPuntJnyuGKt8srPwB/zhZRYQVkOUnSDqr7yEzWm63PJani+Y+VILSXnCK" crossorigin="anonymous">
<script src="https://st.max.ru/js/max-web-app.js"></script>
<!-- MAX UI's module is published for a bundler: the floating-ui code inside it
     reads process.env.NODE_ENV at load, which a bundler would have replaced and
     a browser has no process to read it from. -->
<script>globalThis.process = globalThis.process || { env: { NODE_ENV: "production" } };</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.8",
    "react/jsx-runtime": "https://esm.sh/react@19.2.8/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.2.8?external=react",
    "react-dom/client": "https://esm.sh/react-dom@19.2.8/client?external=react,react-dom",
    "htm": "https://esm.sh/htm@3.1.1",
    "@maxhub/max-ui": "https://cdn.jsdelivr.net/npm/@maxhub/max-ui@0.6.0/dist/index.js"
  },
  "integrity": {
    "https://cdn.jsdelivr.net/npm/@maxhub/max-ui@0.6.0/dist/index.js": "sha384-6NuwHez3B90aAAMLRzAPV3Gz+r2bBhKZ/KizuAXFNjqX2sGSq66zrdMNMW5KOq3O"
  }
}
</script>
<style>
  html, body, #root, .app { height: 100%; }
  html, body { overflow: hidden; overscroll-behavior: none; }
  .app { --snackbar-bottom-offset: 72px; }
  .main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; }
  .view { padding: 12px 0; }
  .void { padding: 24px 16px; text-align: center; }
  .mid { text-align: center; }
  .card { padding: 12px; }
  .lnk { color: var(--text-themed); cursor: pointer; }
  .up { color: var(--icon-positive); }
  .down { color: var(--text-negative); }
  /* Six periods share one row, so the percentages shrink with the width rather
     than wrap. */
  .pct { font-size: min(var(--font-size-label), 3.4vw); }
  /* The Addresses tab fills the scroller whatever it holds, so the picker
     sits at its foot while a list loads and the spinner is centred above it. */
  .fill:not([hidden]) { min-height: 100%; display: flex; flex-direction: column; }
  .fill > .view { flex: 1; padding-bottom: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; }
  .pane.wait { justify-content: center; }
  .seg { position: sticky; bottom: 0; z-index: 1; padding: 8px 12px; background: var(--background-surface); }

  /* Equal sides keep the title on the centre line, and the title's column is
     the one that gives way, so a long title ellipsises rather than run over
     Back. */
  .head { display: grid; grid-template-columns: 1fr minmax(0, auto) 1fr; align-items: center; gap: 8px; padding: 0 12px; }
  .head > :last-child { justify-self: end; }

  .flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px 8px; align-items: start;
          overflow-wrap: anywhere; }
  .flow .c { align-self: center; }
  .out { text-align: right; }
  .count { display: grid; grid-template-columns: repeat(3, auto); column-gap: 4px; justify-items: center; }
  .txcard { padding: 10px 12px; }
  .txcard + .txcard { border-top: 0.5px solid var(--divider-primary); }
  .grow { flex: 1; text-align: center; }

  .plot { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 7.5rem auto; column-gap: 6px;
          margin-top: 4px; color: var(--text-tertiary); font-size: var(--font-size-tag); line-height: 1.2; }
  .yax { display: flex; flex-direction: column; justify-content: space-between; margin: -0.5em 0; line-height: 1em;
         text-align: right; }
  .area { position: relative; border-bottom: 1px solid var(--divider-primary); }
  .gl { position: absolute; left: 0; right: 0; top: 0; border-top: 1px solid var(--divider-secondary); }
  .gl.m { top: 50%; }
  .bars { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 100%; }
  /* The whole column is the target, not the painted bar, so a short one can
     still be tapped. */
  .bar { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; justify-content: center;
         cursor: pointer; outline: none; }
  .bar i { width: 100%; max-width: 24px; background: var(--button-primary); border-radius: 4px 4px 0 0; }
  .bar i.nz { min-height: 2px; }
  .bars.sel .bar i { opacity: .35; }
  .bars.sel .bar.on i { opacity: 1; }
  .ticks { grid-column: 2; display: flex; gap: 2px; height: 1.4em; padding-top: 3px; }
  .ticks > span { flex: 1; min-width: 0; position: relative; }
  .ticks > span > span { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .ticks > span:first-child > span { left: 0; transform: none; }
  .ticks > span:last-child > span { left: auto; right: 0; transform: none; }

  .nav { flex: none; display: flex; border-top: 0.5px solid; }
  .navbtn { flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px; color: var(--text-tertiary); }
  .navbtn.on { color: var(--text-themed); }
  .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7;
         stroke-linecap: round; stroke-linejoin: round; }
  .ico.s { width: 20px; height: 20px; stroke-width: 2; }

  .dlg { width: min(360px, calc(100vw - 32px)); box-sizing: border-box; padding: 16px; border: 0;
         border-radius: var(--size-border-radius-semantic-border-radius-floating); background: var(--background-primary);
         color: var(--text-primary); }
  .dlg::backdrop { background: var(--background-overlay, rgba(12, 13, 14, .32)); }
</style>

<body>
<div id="root"></div>
<script type="module">
import { createElement, Fragment, useState, useEffect, useLayoutEffect, useRef } from "react";
import { createRoot } from "react-dom/client";
import htm from "htm";
import { MaxUI, Panel, Container, Flex, Grid, Typography, EllipsisText, Button, IconButton, CellList, CellHeader,
         CellSimple, Input, Segmented, Spinner, Tappable, SnackbarProvider, useSnackbar, useColorScheme,
         Icon16SearchOutline } from "@maxhub/max-ui";

const html = htm.bind(createElement);
const Text = Typography.Text;
const WebApp = window.WebApp;

// The launch data MAX signs, sent with every request for the server to check.
// The bridge script puts it on window.WebApp; MAX also passes it in the URL
// fragment as WebAppData, which is the fallback if the script did not load.
function launchData() {
  if (WebApp && WebApp.initData) { return WebApp.initData; }
  try { return new URLSearchParams(location.hash.slice(1)).get("WebAppData") || ""; } catch (e) { return ""; }
}
const initData = launchData();
if (WebApp && typeof WebApp.ready === "function") { try { WebApp.ready(); } catch (e) {} }
// The views scroll inside the page and the webview itself never does, so a pull
// down a list would otherwise reach MAX as a swipe closing the app.
if (WebApp && typeof WebApp.disableVerticalSwipes === "function") {
  try { Promise.resolve(WebApp.disableVerticalSwipes()).catch(() => {}); } catch (e) {}
}

function qs(params) { return new URLSearchParams(params).toString(); }

// api fetches one endpoint. A failure carries its status, so a view can tell
// "open this from the bot's chat" (403) from a server that is down.
function api(path, opts) {
  return fetch("api/" + path, Object.assign({ headers: { "X-Max-Init-Data": initData } }, opts)).then(r => {
    if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return r.status === 204 ? null : r.json();
  });
}

// One bus carries every change a view reacts to: the server's events, the
// fallback timers, and the page's own (watchtab, askalias).
const bus = new EventTarget();
function emit(name, detail) { bus.dispatchEvent(new CustomEvent(name, { detail })); }
function useEvent(name, fn) {
  const ref = useRef(fn);
  ref.current = fn;
  useEffect(() => {
    const h = e => ref.current(e.detail);
    bus.addEventListener(name, h);
    return () => bus.removeEventListener(name, h);
  }, [name]);
}
// The stream carries event names only, so it needs no signature. The timers
// are the floor under it, should a proxy ever swallow the stream: the cards and
// the block list every ten minutes, the mempool every thirty seconds.
if (initData && window.EventSource) {
  const es = new EventSource("events");
  ["fees", "network", "market", "blocks", "mempool"].forEach(n => es.addEventListener(n, () => emit(n)));
}
setInterval(() => ["fees", "network", "market", "blocks"].forEach(n => emit(n)), 10 * 60 * 1000);
setInterval(() => emit("mempool"), 30 * 1000);

// useLoad fetches path, and again whenever reload is called. A failed reload
// keeps what is on screen — stale figures beat an error message — and an
// answer for a path the view has moved on from is dropped.
function useLoad(path) {
  const [state, setState] = useState({ loading: true });
  const current = useRef(path);
  current.current = path;
  const reload = () => api(path).then(
    data => { if (current.current === path) { setState({ data }); } },
    error => { if (current.current === path) { setState(s => s.data ? s : { error }); } });
  useEffect(() => { setState({ loading: true }); reload(); }, [path]);
  return [state, reload];
}

function short(s) { return s && s.length > 15 ? s.slice(0, 6) + "..." + s.slice(-6) : s; }
function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

// pageFor classifies what a reader typed or tapped, in the order the bot's
// /info does: the 64-hex shape first — a block hash has it too, and the server
// shows one as its block — then a height, then an address as the catch-all.
function pageFor(q) {
  q = (q || "").trim();
  if (!q) { return null; }
  if (/^[0-9a-fA-F]{64}$/.test(q)) { return { type: "tx", id: q }; }
  if (/^[0-9]+$/.test(q)) { return { type: "block", height: q }; }
  return { type: "address", a: q };
}

// A miner name is not an id the classifier knows, so its link carries the
// Telegram Mini App's URL, of which only the name matters here.
function minerOf(href) {
  const name = new URLSearchParams((href || "").split("?")[1] || "").get("name");
  return name ? { type: "miner", name } : null;
}

// tabOf is the tab a page belongs to, which the bar lights while it is open.
function tabOf(page) { return page.type === "address" ? "addresses" : "blocks"; }

function svg(paths, cls) { return html`<svg viewBox="0 0 24 24" className=${"ico" + (cls ? " " + cls : "")}>${paths}</svg>`; }
const icons = {
  home: svg(html`<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>`),
  blocks: svg(html`<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>`),
  addresses: svg(html`<path d="M4 7h16v13H4z"/><path d="M4 7l8 6 8-6"/>`),
  watches: svg(html`<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>`),
  bell: svg(html`<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>`, "s"),
  edit: svg(html`<path d="M4 20h4L18 10a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>`, "s"),
  copy: svg(html`<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>`, "s"),
  done: svg(html`<path d="M20 6 9 17l-5-5"/>`, "s"),
  back: svg(html`<path d="M15 18l-6-6 6-6"/>`),
};

const tabs = [
  { id: "home", title: "Главная" },
  { id: "blocks", title: "Блоки" },
  { id: "addresses", title: "Адреса" },
  { id: "watches", title: "Наблюдение" },
];

function View({ children }) {
  return html`<${Flex} direction="column" align="stretch" gap=${12} className="view">${children}<//>`;
}

// Status stands in for a view that has nothing to show yet: a spinner while it
// loads, and a sentence when it failed.
function Status({ state }) {
  if (!state || state.loading || (!state.error && !state.data)) {
    return html`<${Flex} justify="center" className="void"><${Spinner} size=${24}/><//>`;
  }
  if (state.error && state.error.status === 401) { return html`<${Empty}>Откройте мини-приложение в MAX<//>`; }
  return html`<${Empty}>не удалось загрузить<//>`;
}

function Empty({ children }) {
  return html`<div className="void"><${Text} variant="description" color="tertiary">${children}<//></div>`;
}

function Note({ children }) { return html`<${Text} variant="description" color="tertiary">${children}<//>`; }

// Link is a tappable piece of text inside a cell. It stops the tap there, so a
// cell that is itself tappable does not open as well.
function Link({ onClick, children }) {
  const go = e => { e.stopPropagation(); onClick(); };
  return html`<span role="link" tabIndex=${0} className="lnk"
    onClick=${go} onKeyDown=${e => { if (e.key === "Enter") { go(e); } }}>${children}</span>`;
}

// Aside is the figure on the right of a list row, a link when it has somewhere
// to go.
function Aside({ onClick, children }) {
  return onClick
    ? html`<${Link} onClick=${onClick}><${Text} variant="description">${children}<//><//>`
    : html`<${Text} variant="description" color="tertiary">${children}<//>`;
}

// Sentinel loads the next batch when it scrolls into view. Each batch renders a
// new one (the caller keys it by where the batch starts), which is what chains
// the loading until the screen is full. A hidden tab's sentinel is not on screen
// and waits until the tab is shown. The views scroll inside .main, so that is
// the root the margin is measured from.
function Sentinel({ onVisible }) {
  const ref = useRef(null);
  const cb = useRef(onVisible);
  cb.current = onVisible;
  useEffect(() => {
    let fired = false;
    const io = new IntersectionObserver(entries => {
      if (fired || !entries.some(e => e.isIntersecting)) { return; }
      fired = true;
      io.disconnect();
      cb.current();
    }, { root: ref.current.closest(".main"), rootMargin: "200px" });
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return html`<${Flex} ref=${ref} justify="center" className="void"><${Spinner} size=${20}/><//>`;
}

function Card({ title, children }) {
  return html`<${CellList} mode="island" header=${html`<${CellHeader} className="mid">${title}<//>`}>
    <${Flex} direction="column" align="stretch" gap=${10} className="card">${children}<//>
  <//>`;
}

function Fig({ label, children, sub }) {
  return html`<${Flex} direction="column" gap=${2}>
    <${Text} variant="label" color="tertiary">${label}<//>
    <${Text} variant="body-strong">${children}<//>
    ${sub ? html`<${Text} variant="description" color="secondary">${sub}<//>` : null}
  <//>`;
}

function FeesCard({ open }) {
  const [s, reload] = useLoad("fees");
  useEvent("fees", reload);
  const f = s.data;
  const tier = (label, t) => html`<${Fig} key=${label} label=${label} sub=${t.USD}>${t.Rate} <${Text} variant="label" color="tertiary">сат/вБ<//><//>`;
  return html`<${Card} title="Комиссии сети">
    ${!f ? html`<${Status} state=${s}/>` : !f.OK ? html`<${Note}>комиссии недоступны<//>` : html`
      <${Grid} cols=${3} gap=${8}>${tier("10-20 мин.", f.Fast)}${tier("~1 час", f.Hour)}${tier("более 2-х ч", f.Slow)}<//>
      <${Note}>на основе <${Link} onClick=${() => open({ type: "mempool" })}>${f.TxCount}<//> ожидающих транзакций<//>`}
  <//>`;
}

function NetworkCard() {
  const [s, reload] = useLoad("network");
  useEvent("network", reload);
  const n = s.data;
  return html`<${Card} title="Блокчейн">
    ${!n ? html`<${Status} state=${s}/>` : !n.OK ? html`<${Note}>статистика сети недоступна<//>` : html`
      <${Grid} cols=${2} gapX=${12} gapY=${10}>
        <${Fig} label="Монет">${n.Coins} / ${n.Cap}<//>
        <${Fig} label="Блоков">${n.Blocks}<//>
        <${Fig} label="Размер">${n.Size}<//>
        <${Fig} label="Активных узлов">${n.Nodes}<//>
        <${Fig} label="Транзакций">${n.Txs}<//>
        <${Fig} label="Активных адресов">${n.Addresses}<//>
      <//>`}
  <//>`;
}

function MarketCard() {
  const [s, reload] = useLoad("market");
  useEvent("market", reload);
  const m = s.data;
  return html`<${Card} title="Рынок">
    ${!m ? html`<${Status} state=${s}/>` : !m.OK ? html`<${Note}>данные рынка недоступны<//>` : html`
      <${Text} variant="header" className="mid">${m.Price}<//>
      <${Grid} cols=${6} gap=${4}>
        ${(m.Changes || []).map(c => html`<${Flex} key=${c.Label} direction="column" align="center" gap=${2}>
          <${Text} variant="label" color="tertiary">${c.Label}<//>
          <${Text} variant="label-strong" color=${c.Neutral ? "tertiary" : "inherit"}
            className=${"pct" + (c.Neutral ? "" : c.Up ? " up" : " down")}>${c.Pct}<//>
        <//>`)}
      <//>`}
  <//>`;
}

function Search({ open }) {
  const [q, setQ] = useState("");
  const submit = e => {
    e.preventDefault();
    const page = pageFor(q);
    if (page) { e.target.querySelector("input").blur(); open(page); }
  };
  return html`<${Container}><form onSubmit=${submit}>
    <${Input} value=${q} onChange=${e => setQ(e.target.value)} type="search" enterKeyHint="search"
      autoCapitalize="off" autoCorrect="off" spellCheck=${false} withClearButton
      iconBefore=${html`<${Icon16SearchOutline}/>`}
      placeholder="Транзакция, блок или адрес" hint="Вставьте ид транзакции, номер блока, либо адрес"/>
  </form><//>`;
}

function Home({ open }) {
  return html`<${View}>
    <${FeesCard} open=${open}/>
    <${NetworkCard}/>
    <${MarketCard}/>
    <${Search} open=${open}/>
  <//>`;
}

// BlockList is the Blocks tab: the newest blocks, older ones appended as the
// reader scrolls, and new ones put on top when a block arrives — inserting above
// the reader leaves the rows they are reading where they are. More new blocks
// than one batch would leave a gap, so then the list starts again from the top.
function BlockList({ open }) {
  const [list, setList] = useState(null);
  const restart = () => api("blocks").then(setList, error => setList(l => l && l.OK ? l : { error }));
  useEffect(() => { restart(); }, []);
  const older = () => api("blocks?before=" + list.Next).then(
    r => setList(l => ({ ...l, Rows: l.Rows.concat(r.Rows || []), Next: r.OK ? r.Next : l.Next, More: r.OK && r.More })),
    () => setList(l => ({ ...l, More: false })));
  useEvent("blocks", () => {
    if (!list || !list.OK) { restart(); return; }
    api("blocks?after=" + list.Top).then(r => {
      if (r.More) { restart(); return; }
      setList(l => {
        const fresh = (r.Rows || []).filter(b => b.Num > l.Rows[0].Num);
        return fresh.length ? { ...l, Rows: fresh.concat(l.Rows), Top: fresh[0].Num } : l;
      });
    }, () => {});
  });
  if (!list || list.error) { return html`<${View}><${Status} state=${list ? list : null}/><//>`; }
  if (!list.OK) { return html`<${View}><${Empty}>блоки ещё не загружены<//><//>`; }
  return html`<${View}>
    <${CellList} mode="island">
      ${list.Rows.map((b, i) => html`<${CellSimple} key=${b.Num} separator=${i > 0} height="compact"
        title=${b.Height} subtitle=${b.Size + " · " + b.Txs}
        onClick=${() => open({ type: "block", height: String(b.Num) })}
        after=${html`<${Aside} onClick=${b.MinerKnown ? () => open({ type: "miner", name: b.Miner }) : null}>${b.Miner}<//>`}/>`)}
    <//>
    ${list.More ? html`<${Sentinel} key=${list.Next} onVisible=${older}/>` : null}
  <//>`;
}

const kinds = [
  { id: "rich", title: "Богатые" },
  { id: "active", title: "Активные" },
  { id: "abandoned", title: "Забытые" },
];

// AddressLists is the Addresses tab: one of three ranked lists, picked at the
// foot of the tab. Nothing is ever inserted above these rows, so a batch is an
// offset, and there is no event to wait for.
function AddressLists({ open }) {
  const [kind, setKind] = useState("rich");
  const [list, setList] = useState(null);
  useEffect(() => {
    let alive = true;
    setList(null);
    api("addresses?kind=" + kind).then(r => alive && setList(r), error => alive && setList({ error }));
    return () => { alive = false; };
  }, [kind]);
  const pick = k => { document.querySelector(".main").scrollTop = 0; setKind(k); };
  const more = () => api("addresses?" + qs({ kind, from: list.Next })).then(
    r => setList(l => l && l.Kind === r.Kind ? { ...l, Rows: l.Rows.concat(r.Rows || []), Next: r.Next, More: r.OK && r.More } : l),
    () => setList(l => ({ ...l, More: false })));
  let body;
  if (!list || list.error) {
    body = html`<div className="pane wait"><${Status} state=${list}/></div>`;
  } else if (!list.OK) {
    body = html`<div className="pane wait"><${Empty}>адресов пока нет<//></div>`;
  } else {
    body = html`<div className="pane"><${CellList} mode="island">
      ${list.Rows.map((a, i) => html`<${CellSimple} key=${a.Idx} separator=${i > 0} height="compact" title=${a.Short}
        after=${html`<${Aside}>${a.Value}<//>`} onClick=${() => open({ type: "address", a: a.Id })}/>`)}
    <//>
    ${list.More ? html`<${Sentinel} key=${kind + list.Next} onVisible=${more}/>` : null}</div>`;
  }
  return html`<${View}>
    ${body}
    <div className="seg"><${Segmented} items=${kinds} activeItem=${kind} onClick=${pick}/></div>
  <//>`;
}

// WatchList is the Watches tab, the reader's own: fetched whenever the tab is
// shown and whenever a watch changes, and never kept warm.
function WatchList({ open, shown }) {
  const [w, setW] = useState(null);
  const load = () => {
    if (!initData) { return; }
    api("watches").then(setW, error => setW({ error }));
  };
  useEffect(() => { if (shown) { load(); } }, [shown]);
  useEvent("watchtab", load);
  const rows = (items, kind) => items.map((x, i) => html`<${CellSimple} key=${x.Id} separator=${i > 0} height="compact"
    title=${x.Short} subtitle=${x.Alias || null}
    onClick=${() => open(kind === "tx" ? { type: "tx", id: x.Id } : { type: "address", a: x.Id })}
    after=${html`<${IconButton} variant="ghost" size="small" aria-label="Изменить"
      onClick=${e => { e.stopPropagation(); emit("askalias", { kind, id: x.Id, alias: x.Alias, edit: true }); }}>${icons.edit}<//>`}/>`);
  let body;
  if (!initData) {
    body = html`<${Empty}>Наблюдение доступно только в MAX<//>`;
  } else if (!w) {
    body = html`<${Status}/>`;
  } else if (w.error && w.error.status === 403) {
    body = html`<${Empty}>Откройте мини-приложение из чата с ботом, чтобы следить за адресами и транзакциями<//>`;
  } else if (w.error || !w.OK) {
    body = html`<${Empty}>наблюдение недоступно<//>`;
  } else if (!(w.Addresses || []).length && !(w.Txs || []).length) {
    body = html`<${Empty}>Вы пока ни за чем не следите<//>`;
  } else {
    body = html`
      ${(w.Addresses || []).length ? html`<${CellList} mode="island" header=${html`<${CellHeader}>Адреса<//>`}>${rows(w.Addresses, "address")}<//>` : null}
      ${(w.Txs || []).length ? html`<${CellList} mode="island" header=${html`<${CellHeader}>Транзакции<//>`}>${rows(w.Txs, "tx")}<//>` : null}`;
  }
  return html`<${View}>${body}<//>`;
}

function copyText(text) {
  const legacy = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok ? Promise.resolve() : Promise.reject(new Error("copy failed"));
  };
  if (navigator.clipboard && navigator.clipboard.writeText) { return navigator.clipboard.writeText(text).catch(legacy); }
  return legacy();
}

function CopyButton({ id }) {
  const [done, setDone] = useState(false);
  const copy = () => copyText(id).then(() => { setDone(true); setTimeout(() => setDone(false), 1200); }, () => {});
  return html`<${IconButton} variant="ghost" size="small" aria-label="Копировать" onClick=${copy}>
    <span className=${done ? "up" : ""}>${done ? icons.done : icons.copy}</span>
  <//>`;
}

// Bell is the watch button: pushed means watching, and a tap sets the opposite.
// The state it asks for rides in the request, so a stale button cannot flip a
// watch back. A watch just filed has no name yet, so the alias dialog opens —
// the second half of the two-step add. Opened anywhere but the bot's chat there
// is nowhere a notification could go, and the bell stays away.
function Bell({ kind, id }) {
  const [on, setOn] = useState(null);
  const [busy, setBusy] = useState(false);
  const { showSnackbar } = useSnackbar();
  useEffect(() => {
    let alive = true;
    setOn(null);
    api("watch?" + qs({ kind, id })).then(r => alive && setOn(r.On), () => alive && setOn(undefined));
    return () => { alive = false; };
  }, [kind, id]);
  if (on === undefined) { return null; }
  const toggle = () => {
    const want = !on;
    setBusy(true);
    api("watch?" + qs({ kind, id, on: want ? "1" : "0" }), { method: "POST" }).then(r => {
      setOn(r.On);
      emit("watchtab");
      if (r.Error) { showSnackbar({ text: "Не удалось изменить наблюдение" }); }
      else if (want && !r.On) { showSnackbar({ text: "Достигнут предел наблюдений — сначала уберите одно из них" }); }
      else if (want) { emit("askalias", { kind, id, alias: "", edit: false }); }
    }, () => showSnackbar({ text: "Не удалось изменить наблюдение" })).finally(() => setBusy(false));
  };
  return html`<${IconButton} variant=${on ? "primary" : "secondary"} size="small" loading=${busy || on === null}
    aria-label=${on ? "Не следить" : "Следить"} aria-pressed=${!!on} onClick=${toggle}>${icons.bell}<//>`;
}

// Head is a page's title row: Back, the title with its copy button, and the
// bell. Back is an icon, so the sides stay narrow enough for a shortened id to
// fit between them on a 320px phone.
function Head({ title, back, kind, id, confirmed }) {
  return html`<div className="head">
    <${IconButton} variant="ghost" size="small" aria-label="Назад" onClick=${back}>${icons.back}<//>
    <${Flex} align="center" gap=${2}>
      <${EllipsisText}><${Typography.Headline} variant="small">${title}<//><//>
      ${kind ? html`<${CopyButton} id=${id}/>` : null}
    <//>
    <div>${kind && !confirmed ? html`<${Bell} kind=${kind} id=${id}/>` : null}</div>
  </div>`;
}

// Value is a field's value, with the ids it mentions made tappable: an address
// or a block opens its page, a miner name the miner's.
function Value({ field, open }) {
  if (!field.Parts) { return field.Value; }
  return field.Parts.map((p, i) => p.Href
    ? html`<${Link} key=${i} onClick=${() => open(minerOf(p.Href))}>${p.Text}<//>`
    : p.Id ? html`<${Link} key=${i} onClick=${() => open(pageFor(p.Id))}>${p.Text}<//>`
    : html`<span key=${i}>${p.Text}</span>`);
}

// Fields are a details page's lines — the very ones the bot prints. A line with
// no value is a heading ("Комиссии", "Размеры"), which starts a group of its own.
function Fields({ rows, open }) {
  const groups = [];
  let cur = { title: null, rows: [] };
  (rows || []).forEach(f => {
    if (f.Value) { cur.rows.push(f); return; }
    if (cur.title || cur.rows.length) { groups.push(cur); }
    cur = { title: f.Label, rows: [] };
  });
  groups.push(cur);
  return groups.filter(g => g.title || g.rows.length).map((g, i) => html`<${CellList} key=${i} mode="island"
      header=${g.title ? html`<${CellHeader}>${g.title}<//>` : null}>
    ${g.rows.map((f, j) => html`<${CellSimple} key=${j} separator=${j > 0} height="compact" overline=${f.Label}
      title=${html`<${Value} field=${f} open=${open}/>`}/>`)}
  <//>`);
}

function Side({ parts, open, amounts, out }) {
  return html`<${Flex} direction="column" gap=${4} align=${out ? "flex-end" : "flex-start"} className=${out ? "out" : ""}>
    ${(parts || []).map((p, i) => html`<div key=${i}>
      <${Text} variant="description">${p.Id ? html`<${Link} onClick=${() => open(pageFor(p.Id))}>${p.Text}<//>` : p.Text}<//>
      ${amounts && p.Amount ? html`<div><${Text} variant="label" color="secondary">${p.Amount}<//></div>` : null}
    </div>`)}
  <//>`;
}

// Flow is a transaction's two sides: the input addresses on the left, the
// outputs on the right, each with what it moved.
function Flow({ info, open }) {
  return html`<${CellList} mode="island"><div className="card flow">
    <${Text} variant="label" color="tertiary">${info.InCount} вх.<//>
    <span></span>
    <${Text} variant="label" color="tertiary" className="out">${info.OutCount} вых.<//>
    <${Side} parts=${info.Inputs} open=${open} amounts/>
    <${Text} variant="title" color="tertiary" className="c">→<//>
    <${Side} parts=${info.Outputs} open=${open} amounts out/>
  </div><//>`;
}

function TxCard({ tx, open }) {
  return html`<${Flex} direction="column" align="stretch" gap=${6} className="txcard">
    <${Flex} justify="space-between" align="baseline" gap=${8}>
      <${Text} variant="description" color="tertiary">${tx.Time}<//>
      <${EllipsisText} className="grow">
        <${Link} onClick=${() => open({ type: "tx", id: tx.Id })}><${Text} variant="description">${tx.Short}<//><//>
      <//>
      <${Flex} direction="column" align="flex-end">
        <${Text} variant="detail-strong">${tx.Amount}<//>
        ${tx.USD ? html`<${Text} variant="label" color="tertiary">${tx.USD}<//>` : null}
      <//>
    <//>
    <div className="flow">
      <${Side} parts=${tx.Inputs} open=${open}/>
      <div className="count c">
        <${Text} variant="description">${tx.InCount}<//><${Text} variant="description" color="tertiary">→<//><${Text} variant="description">${tx.OutCount}<//>
        <${Text} variant="tag" color="tertiary">вх.<//><span></span><${Text} variant="tag" color="tertiary">вых.<//>
      </div>
      <${Side} parts=${tx.Outputs} open=${open} out/>
    </div>
  <//>`;
}

// AddrTxs is an address page's transactions, newest first: the first batch comes
// with the page, the rest as the reader scrolls.
function AddrTxs({ first, open }) {
  const [txs, setTxs] = useState(first);
  const more = () => api("addrtxs?" + qs({ a: txs.Addr, from: txs.Next })).then(
    r => setTxs(t => r.OK ? { ...t, Rows: t.Rows.concat(r.Rows || []), Next: r.Next, More: r.More } : { ...t, More: false }),
    () => setTxs(t => ({ ...t, More: false })));
  const rows = txs.Rows || [];
  return html`<${CellList} mode="island" header=${html`<${CellHeader}>Транзакции<//>`}>
    ${rows.length ? rows.map(t => html`<${TxCard} key=${t.Id} tx=${t} open=${open}/>`) : html`<${Empty}>пока нет транзакций<//>`}
    ${txs.More ? html`<${Sentinel} key=${txs.Next} onVisible=${more}/>` : null}
  <//>`;
}

const chartData = [{ id: "blocks", title: "Блоки" }, { id: "consumption", title: "Потребление" }];
const chartPeriods = [{ id: "month", title: "Месяц" }, { id: "quarter", title: "Квартал" }, { id: "year", title: "Год" }];
const hoverable = window.matchMedia && matchMedia("(hover: hover)").matches;

// Chart is the bars under a miner's details. The headline shows the period's
// figure until a bar is pointed at or tapped, then that bar's; a tap holds the
// bar — there is no hover on a phone — and a second tap lets it go.
function Chart({ first }) {
  const [chart, setChart] = useState(first);
  const [held, setHeld] = useState(-1);
  const [hover, setHover] = useState(-1);
  const [busy, setBusy] = useState(false);
  const pick = (data, period) => {
    setBusy(true);
    setHeld(-1);
    api("minerchart?" + qs({ name: chart.Name, data, period })).then(setChart, () => {}).finally(() => setBusy(false));
  };
  const bars = chart.Bars || [];
  const shown = hover >= 0 ? bars[hover] : held >= 0 ? bars[held] : null;
  return html`<${CellList} mode="island"><${Flex} direction="column" align="stretch" gap=${8} className="card">
    <${Segmented} items=${chartData} activeItem=${chart.Data} onClick=${d => pick(d, chart.Period)}/>
    <${Segmented} items=${chartPeriods} activeItem=${chart.Period} onClick=${p => pick(chart.Data, p)}/>
    ${busy ? html`<${Flex} justify="center" className="void"><${Spinner} size=${20}/><//>` : !chart.OK ? html`<${Empty}>нет блоков за этот период<//>` : html`
      <${EllipsisText}>
        <${Text} variant="description-strong">${shown ? shown.Value : chart.Value}<//>${" "}
        <${Text} variant="description" color="tertiary">${shown ? shown.Label : chart.Label}<//>
      <//>
      <div className="plot">
        <div className="yax"><span>${chart.Top}</span><span>${chart.Mid}</span><span>0</span></div>
        <div className="area">
          <div className="gl"></div><div className="gl m"></div>
          <div className=${"bars" + (held >= 0 ? " sel" : "")}>
            ${bars.map((b, i) => html`<div key=${i} className=${"bar" + (i === held ? " on" : "")} tabIndex=${0}
              onClick=${() => setHeld(h => h === i ? -1 : i)}
              onMouseEnter=${hoverable ? () => setHover(i) : null} onMouseLeave=${hoverable ? () => setHover(-1) : null}
              onFocus=${() => setHover(i)} onBlur=${() => setHover(-1)}>
              <i className=${b.Height ? "nz" : ""} style=${{ height: b.Height + "%" }}></i></div>`)}
          </div>
        </div>
        <div className="ticks">${bars.map((b, i) => html`<span key=${i}>${b.Tick ? html`<span>${b.Tick}</span>` : null}</span>`)}</div>
      </div>`}
  <//><//>`;
}

// Details is a block, transaction, address or miner page. title stands in until
// the page arrives, and stays when there is nothing to show.
function Details({ path, title, open, back }) {
  const [s] = useLoad(path);
  const info = s.data;
  const ok = info && info.OK;
  return html`<${View}>
    <${Head} title=${info && info.Title ? info.Title : title} back=${back}
      kind=${ok ? info.Kind : ""} id=${ok ? info.Id : ""} confirmed=${ok && info.Confirmed}/>
    ${!info ? html`<${Status} state=${s}/>` : !ok
      ? html`<${Empty}>${(info.Rows || []).length ? info.Rows[0].Label : "ничего не найдено"}<//>` : html`
      <${Fields} rows=${info.Rows} open=${open}/>
      ${(info.Inputs || []).length || (info.Outputs || []).length ? html`<${Flow} info=${info} open=${open}/>` : null}
      ${info.Txs ? html`<${AddrTxs} first=${info.Txs} open=${open}/>` : null}
      ${info.Chart ? html`<${Chart} first=${info.Chart}/>` : null}`}
  <//>`;
}

const keptTxs = 100;
const ago = window.Intl && Intl.RelativeTimeFormat ? new Intl.RelativeTimeFormat("ru", { style: "short", numeric: "always" }) : null;
function agoText(at, now) {
  const s = Math.max(0, Math.round(now / 1000 - at));
  if (!ago) { return ""; }
  return s < 60 ? ago.format(-s, "second") : s < 3600 ? ago.format(-Math.floor(s / 60), "minute") : ago.format(-Math.floor(s / 3600), "hour");
}

// Mempool is the live mempool page: the fields /mempool prints, and the
// arrivals newest first. Each event fetches what arrived since the newest one
// seen, drops what a block has mined since, and keeps the hundred rows the
// server does. An answer that lost track says so, and comes whole.
function Mempool({ open, back }) {
  const [mp, setMp] = useState(null);
  const [now, setNow] = useState(Date.now());
  const top = useRef(-1);
  const busy = useRef(false);
  const load = whole => {
    if (busy.current) { return; }
    busy.current = true;
    const after = whole ? -1 : top.current;
    api("mempool" + (after >= 0 ? "?after=" + after : "")).then(r => {
      top.current = r.Top;
      setMp(cur => {
        if (!cur || cur.error || after < 0 || r.More) { return { OK: r.OK, Rows: r.Rows || [], Txs: (r.Txs || []).slice(0, keptTxs) }; }
        const gone = new Set(r.Gone || []);
        const txs = (r.Txs || []).concat(cur.Txs.filter(t => !gone.has(t.Id))).slice(0, keptTxs);
        return { ...cur, Rows: (r.Rows || []).length ? r.Rows : cur.Rows, Txs: txs };
      });
    }, error => setMp(cur => cur || { error })).finally(() => { busy.current = false; });
  };
  useEffect(() => { load(true); }, []);
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  useEvent("mempool", () => { if (mp && !mp.error) { load(false); } });
  let body;
  if (!mp || mp.error) {
    body = html`<${Status} state=${mp ? { error: mp.error } : null}/>`;
  } else if (!mp.OK) {
    body = html`<${Empty}>${mp.Rows.length ? mp.Rows[0].Label : "ничего не найдено"}<//>`;
  } else {
    body = html`<${Fields} rows=${mp.Rows} open=${open}/>
      <${CellList} mode="island" header=${html`<${CellHeader}>Новые транзакции<//>`}>
        ${mp.Txs.length ? mp.Txs.map((t, i) => html`<${CellSimple} key=${t.Id} separator=${i > 0} height="compact" title=${t.Short}
          subtitle=${t.Amount} after=${html`<${Aside}>${agoText(t.At, now)}<//>`}
          onClick=${() => open({ type: "tx", id: t.Id })}/>`) : html`<${Empty}>ожидание транзакций…<//>`}
      <//>`;
  }
  return html`<${View}><${Head} title="Мемпул" back=${back}/>${body}<//>`;
}

function Page({ page, open, back }) {
  switch (page.type) {
    case "block": return html`<${Details} path=${"block?height=" + page.height} title=${"Блок " + group(page.height)} open=${open} back=${back}/>`;
    case "tx": return html`<${Details} path=${"tx?id=" + page.id} title=${short(page.id)} open=${open} back=${back}/>`;
    case "address": return html`<${Details} path=${"address?" + qs({ a: page.a })} title=${short(page.a)} open=${open} back=${back}/>`;
    case "miner": return html`<${Details} path=${"miner?" + qs({ name: page.name })} title=${page.name} open=${open} back=${back}/>`;
    case "mempool": return html`<${Mempool} open=${open} back=${back}/>`;
  }
  return null;
}

// AliasDialog names a watch, in two shapes: right after the bell files one it
// offers only Save, while the Watches tab's edit icon can also delete. Save on
// an empty field changes nothing, which is how a reader dismisses it. The
// buttons are stacked: "Изменить псевдоним" does not fit half the dialog on a
// 320px phone.
function AliasDialog() {
  const ref = useRef(null);
  const input = useRef(null);
  const [st, setSt] = useState({ kind: "", id: "", alias: "", edit: false });
  const [busy, setBusy] = useState(false);
  const { showSnackbar } = useSnackbar();
  const close = () => { const d = ref.current; if (d.close) { d.close(); } else { d.removeAttribute("open"); } };
  useEvent("askalias", detail => {
    setSt({ kind: detail.kind, id: detail.id, alias: detail.alias || "", edit: !!detail.edit });
    const d = ref.current;
    if (d.showModal) { if (!d.open) { d.showModal(); } } else { d.setAttribute("open", ""); }
    setTimeout(() => input.current && input.current.focus(), 0);
  });
  const done = (req, fail) => {
    setBusy(true);
    req.then(() => { close(); emit("watchtab"); }, () => showSnackbar({ text: fail })).finally(() => setBusy(false));
  };
  const save = e => {
    e.preventDefault();
    done(api("alias", { method: "POST", body: new URLSearchParams({ kind: st.kind, id: st.id, alias: st.alias }) }),
      "Не удалось сохранить псевдоним");
  };
  const remove = () => done(api("watch?" + qs({ kind: st.kind, id: st.id, on: "0" }), { method: "POST" }),
    "Не удалось удалить наблюдение");
  return html`<dialog ref=${ref} className="dlg" onClick=${e => { if (e.target === ref.current) { close(); } }}>
    <form onSubmit=${save}><${Flex} direction="column" align="stretch" gap=${12}>
      <${Typography.Title} className="mid">Псевдоним<//>
      <${Input} ref=${input} value=${st.alias} onChange=${e => setSt({ ...st, alias: e.target.value })} maxLength=${64}
        autoComplete="off" autoCapitalize="off" placeholder="Псевдоним для наблюдения"/>
      <${Flex} direction="column" align="stretch" gap=${8}>
        <${Button} type="submit" stretched loading=${busy}>${st.edit ? "Изменить псевдоним" : "Сохранить"}<//>
        ${st.edit ? html`<${Button} type="button" variant="destructive" stretched disabled=${busy} onClick=${remove}>Удалить<//>` : null}
      <//>
    <//></form>
  </dialog>`;
}

// Nav is the tab bar. The canvas behind the app takes the bar's colour, so a
// strip of webview below the page — a phone's inset the page is not told of —
// reads as the bar running on to the screen's edge.
function Nav({ active, go }) {
  const ref = useRef(null);
  const scheme = useColorScheme();
  useLayoutEffect(() => {
    document.documentElement.style.backgroundColor = getComputedStyle(ref.current).backgroundColor;
  }, [scheme]);
  return html`<nav ref=${ref} className="nav">${tabs.map(t => html`<${Tappable} key=${t.id} as="button" type="button"
    className=${"navbtn" + (t.id === active ? " on" : "")} onClick=${() => go(t.id)}>
    ${icons[t.id]}<${Text} variant="tag">${t.title}<//>
  <//>`)}</nav>`;
}

// App keeps the four tabs mounted, so a list keeps its rows and the place the
// reader had scrolled to. A page opened on top of them goes on a stack, and
// Back pops it: a chain of pages unwinds one at a time, to where the reader
// started. .main is the one scroller, so each view's scroll position is saved
// as it is left and put back when it is shown again. Tapping a tab drops the
// stack and shows that tab as it was.
function App() {
  const [root, setRoot] = useState("home");
  const [stack, setStack] = useState([]);
  const main = useRef(null);
  const scrolls = useRef({});
  const seq = useRef(0);
  const top = stack.length ? stack[stack.length - 1] : null;
  const view = top ? top.key : "tab:" + root;
  const shown = useRef(view);
  const leave = () => { scrolls.current[shown.current] = main.current.scrollTop; };
  const open = page => {
    if (!page) { return; }
    leave();
    seq.current += 1;
    const key = "page:" + seq.current;
    setStack(s => s.concat([{ key, page, tab: tabOf(page) }]));
  };
  const back = () => { leave(); setStack(s => s.slice(0, -1)); };
  const go = tab => { leave(); setStack([]); setRoot(tab); };
  useLayoutEffect(() => {
    shown.current = view;
    main.current.scrollTop = scrolls.current[view] || 0;
  }, [view]);
  const backRef = useRef(back);
  backRef.current = back;
  useEffect(() => {
    const bb = WebApp && WebApp.BackButton;
    if (!bb || !bb.onClick) { return; }
    const h = () => backRef.current();
    try { bb.onClick(h); } catch (e) {}
    return () => { try { if (bb.offClick) { bb.offClick(h); } } catch (e) {} };
  }, []);
  useEffect(() => {
    const bb = WebApp && WebApp.BackButton;
    try { if (bb) { if (stack.length) { bb.show(); } else { bb.hide(); } } } catch (e) {}
  }, [stack.length]);
  const onTab = t => !top && root === t;
  return html`<${Fragment}>
    <main ref=${main} className="main">
      <div hidden=${!onTab("home")}><${Home} open=${open}/></div>
      <div hidden=${!onTab("blocks")}><${BlockList} open=${open}/></div>
      <div className="fill" hidden=${!onTab("addresses")}><${AddressLists} open=${open}/></div>
      <div hidden=${!onTab("watches")}><${WatchList} open=${open} shown=${onTab("watches")}/></div>
      ${stack.map(e => html`<div key=${e.key} hidden=${e !== top}><${Page} page=${e.page} open=${open} back=${back}/></div>`)}
    </main>
    <${Nav} active=${top ? top.tab : root} go=${go}/>
    <${AliasDialog}/>
  <//>`;
}

// MAX UI picks its look from the platform: MAX names it, and on a desktop or
// the web MAX UI's own guess stands.
const platform = WebApp && (WebApp.platform === "ios" || WebApp.platform === "android") ? WebApp.platform : undefined;

createRoot(document.getElementById("root")).render(html`<${MaxUI} platform=${platform} className="app" resetBody>
  <${Panel} mode="secondary">
    <${SnackbarProvider}>${initData ? html`<${App}/>` : html`<${Empty}>Откройте мини-приложение в MAX<//>`}<//>
  <//>
<//>`);
</script>
</body>
</html>
