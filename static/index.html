<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BITNSBOT</title>
    <meta name="description" content="Bitcoin blockchain explorer and notification bot for Telegram and MAX.">
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #ffffff;
            --text: #16181d;
            --muted: #646b78;
            --line: #e3e6eb;
            --accent: #f7931a;
            --dot: #c9ced6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111317;
                --card: #1b1e24;
                --text: #eceef2;
                --muted: #9aa1ad;
                --line: #2a2e36;
                --dot: #4a505b;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        a { color: inherit; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            max-width: 1040px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .title {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 0.12em;
        }
        .title span { color: var(--accent); }
        .github {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--card);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9375rem;
        }
        .github:hover { border-color: var(--muted); }
        .github svg { width: 20px; height: 20px; fill: currentColor; }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            max-width: 1040px;
            width: 100%;
            margin: 0 auto;
            padding: 8px 16px 24px;
        }
        .tagline {
            margin: 0;
            max-width: 40em;
            text-align: center;
            color: var(--muted);
            font-size: 1.0625rem;
        }
        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 56px;
            width: 100%;
        }
        .carousel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .screens {
            position: relative;
            width: clamp(160px, min(78vw, calc((100vh - 380px) * 0.445)), 300px);
            aspect-ratio: 570 / 1280;
            border-radius: 28px;
            overflow: hidden;
            background: var(--card);
            box-shadow: 0 0 0 8px var(--card), 0 0 0 9px var(--line), 0 24px 48px rgba(0, 0, 0, 0.18);
        }
        .screens img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .screens img.active { opacity: 1; }
        .dots { display: flex; gap: 6px; }
        .dots button {
            width: 28px;
            height: 28px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            display: grid;
            place-items: center;
        }
        .dots button::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--dot);
            transition: background 0.3s, transform 0.3s;
        }
        .dots button[aria-current="true"]::before { background: var(--accent); transform: scale(1.25); }
        .dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 50%; }
        .qrs {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .qr {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px 16px 14px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--card);
            text-decoration: none;
            transition: border-color 0.2s;
        }
        .qr:hover { border-color: var(--muted); }
        .qr img {
            display: block;
            width: clamp(104px, calc(50vh - 256px), 180px);
            height: clamp(104px, calc(50vh - 256px), 180px);
            border-radius: 8px;
        }
        .qr strong { font-size: 1rem; }
        .qr small { color: var(--muted); font-size: 0.875rem; }
        footer {
            padding: 14px 16px 18px;
            border-top: 1px solid var(--line);
            text-align: center;
            color: var(--muted);
            font-size: 0.875rem;
        }
        @media (max-width: 720px) {
            .stage { flex-direction: column; gap: 40px; }
            .qrs { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 12px; }
            .qr { padding: 12px 12px 10px; gap: 6px; }
            .qr img { width: 128px; height: 128px; }
            .qr small { font-size: 0.8125rem; }
        }
        @media (max-width: 360px) {
            .title { font-size: 1.375rem; }
            .github span { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .screens img, .dots button::before { transition: none; }
        }
    </style>
</head>
<body>
    <header>
        <h1 class="title"><span>BIT</span>NSBOT</h1>
        <a class="github" href="https://github.com/pin2t/bitnsbot">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
            <span>GitHub</span>
        </a>
    </header>
    <main>
        <p class="tagline">Bitcoin blockchain explorer and notification bot for Telegram and MAX: watch addresses and transactions, look up blocks, fees, the mempool and the market — in chat or in the Mini App.</p>
        <div class="stage">
            <section class="carousel" aria-label="Screenshots">
                <div class="screens">
                    <img class="active" src="img/screen-1.jpeg" alt="The bot's commands and an address notification">
                    <img src="img/screen-2.jpeg" alt="Notifications in the chat" loading="lazy">
                    <img src="img/screen-3.jpeg" alt="Mini App home: fees, blockchain and market" loading="lazy">
                    <img src="img/screen-4.jpeg" alt="Mini App: the richest addresses" loading="lazy">
                    <img src="img/screen-5.jpeg" alt="Mini App: an address's statistics" loading="lazy">
                </div>
                <div class="dots"></div>
            </section>
            <section class="qrs" aria-label="Open the bot">
                <a class="qr" href="https://t.me/bitnsbot">
                    <img src="img/qr-telegram.svg" alt="QR code for @bitnsbot on Telegram">
                    <strong>Telegram</strong>
                    <small>@bitnsbot</small>
                </a>
                <a class="qr" href="https://max.ru/se14621575_bot">
                    <img src="img/qr-max.svg" alt="QR code for the bot on MAX">
                    <strong>MAX</strong>
                    <small>max.ru/se14621575_bot</small>
                </a>
            </section>
        </div>
    </main>
    <footer>Open source software. MIT license.</footer>
    <script>
        (function () {
            var screens = document.querySelectorAll(".screens img");
            var dots = document.querySelector(".dots");
            var current = 0;
            var timer;
            screens.forEach(function (img, i) {
                var dot = document.createElement("button");
                dot.type = "button";
                dot.setAttribute("aria-label", "Screenshot " + (i + 1) + ": " + img.alt);
                dot.addEventListener("click", function () { show(i); });
                dots.appendChild(dot);
            });
            function show(i) {
                screens[current].classList.remove("active");
                dots.children[current].removeAttribute("aria-current");
                current = (i + screens.length) % screens.length;
                screens[current].classList.add("active");
                dots.children[current].setAttribute("aria-current", "true");
                clearInterval(timer);
                timer = setInterval(function () { show(current + 1); }, 5000);
            }
            show(0);
        })();
    </script>
</body>
</html>
