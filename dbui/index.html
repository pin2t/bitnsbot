<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitnsbot database</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #d9dce1; --text: #1a1c20;
    --muted: #6b7280; --accent: #2563eb; --accent-text: #fff; --hover: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1c1f25; --line: #2c313a; --text: #e5e7eb;
      --muted: #9aa2ad; --accent: #3b82f6; --accent-text: #fff; --hover: #232833;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; text-align: center; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    align-items: center; margin-bottom: 16px;
  }
  select, input, button, textarea {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
  }
  select { height: 37px; }
  input { min-width: 220px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button:hover { background: var(--hover); }
  button.primary:hover { filter: brightness(1.08); }
  .tabs { display: flex; justify-content: center; gap: 4px; margin-bottom: -1px; }
  .tab {
    background: transparent; border: 1px solid transparent; border-bottom: none;
    border-radius: 6px 6px 0 0; padding: 8px 20px; color: var(--muted);
  }
  .tab.active {
    background: var(--panel); border-color: var(--line); color: var(--text);
  }
  .panel {
    display: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 0 8px 8px 8px; padding: 16px; min-height: 260px;
  }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  th { color: var(--muted); font-weight: 600; font-family: inherit; font-size: 12px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  td.del { width: 1px; padding-right: 4px; text-align: center; }
  .trash {
    display: inline-flex; padding: 4px; border: none; background: transparent;
    border-radius: 5px; color: var(--muted); vertical-align: middle;
  }
  .trash:hover { background: var(--hover); color: #dc2626; }
  .trash svg { width: 15px; height: 15px; display: block; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; color: var(--muted); }
  textarea {
    width: 100%; min-height: 300px; resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  }
  .valbar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  #status { text-align: center; min-height: 20px; margin-top: 12px; font-size: 13px; }
  #status.err { color: #dc2626; }
  #status.ok { color: #16a34a; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .dialog-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .dialog-overlay[hidden] { display: none; }
  .dialog {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 20px 24px; min-width: 320px; max-width: 420px;
  }
  .dialog p { margin: 0 0 12px; }
  .dialog label { display: block; margin-bottom: 6px; cursor: pointer; }
  .dialog input[type="radio"] { min-width: 0; margin-right: 6px; }
  .dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .mode { font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .mode input { min-width: 0; margin-right: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>bitnsbot database</h1>

  <div class="controls">
    <select id="bucket" title="bucket"></select>
    <button id="view">View</button>
    <input id="key" placeholder="key" autocomplete="off">
    <button id="get">Get</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-panel="data">Data</button>
    <button class="tab" data-panel="value">Value</button>
  </div>

  <div id="data" class="panel active">
    <table>
      <thead><tr><th><button id="clearBucket" class="trash" title="Clear bucket"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11"/><path d="M6.5 4V2.7c0-.4.3-.7.7-.7h1.6c.4 0 .7.3.7.7V4"/><path d="M3.5 4l.6 8.5c0 .5.5 1 1 1h5.8c.5 0 1-.5 1-1L13.5 4"/><path d="M6.5 6.5v5M9.5 6.5v5"/></svg></button></th><th style="width:40%">Key</th><th>Value</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <template id="trashTemplate">
      <button class="trash" title="delete this key">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.5 4h11"/>
          <path d="M6.5 4V2.7c0-.4.3-.7.7-.7h1.6c.4 0 .7.3.7.7V4"/>
          <path d="M3.5 4l.6 8.5c0 .5.5 1 1 1h5.8c.5 0 1-.5 1-1L13.5 4"/>
          <path d="M6.5 6.5v5M9.5 6.5v5"/>
        </svg>
      </button>
    </template>
    <div id="empty" class="empty" hidden>Press <b>View</b> to load a bucket.</div>
    <div class="pager">
      <button id="prev">Prev</button>
      <span id="pageLabel">—</span>
      <button id="next">Next</button>
      <button id="exportBtn">Export</button>
      <button id="importBtn">Import</button>
    </div>
  </div>

  <div id="importDialog" class="dialog-overlay" hidden>
    <div class="dialog">
      <p>Import CSV into <strong id="importBucketLabel"></strong></p>
      <label><input type="radio" name="strategy" value="skip" checked> Skip existing keys</label>
      <label><input type="radio" name="strategy" value="replace"> Replace existing keys</label>
      <div class="dialog-buttons">
        <button id="importCancel">Cancel</button>
        <button id="importGo" class="primary">Import</button>
      </div>
      <input type="file" id="importFileInput" accept=".csv" hidden>
    </div>
  </div>

  <div id="value" class="panel">
    <textarea id="valbox" placeholder="value" spellcheck="false"></textarea>
    <div class="valbar">
      <span id="valFor"></span>
      <span>
        <label class="mode"><input type="radio" name="fmt" value="raw" checked> raw</label>
        <label class="mode"><input type="radio" name="fmt" value="msgpack"> msgpack</label>
        <button id="put" class="primary">Put</button>
      </span>
    </div>
  </div>

  <div id="status"></div>
</div>

<script>
  var page = 0;
  var $ = function(id) { return document.getElementById(id); };

  function status(msg, kind) {
    var el = $("status");
    el.textContent = msg || "";
    el.className = kind || "";
  }

  function showTab(name) {
    document.querySelectorAll(".tab").forEach(function(t) {
      t.classList.toggle("active", t.dataset.panel === name);
    });
    document.querySelectorAll(".panel").forEach(function(p) {
      p.classList.toggle("active", p.id === name);
    });
  }
  document.querySelectorAll(".tab").forEach(function(t) {
    t.addEventListener("click", function() { showTab(t.dataset.panel); });
  });

  function loadBuckets() {
    fetch("api/buckets").then(function(r) { return r.json(); }).then(function(d) {
      var sel = $("bucket");
      sel.innerHTML = "";
      (d.buckets || []).forEach(function(name) {
        var o = document.createElement("option");
        o.value = name; o.textContent = name;
        sel.appendChild(o);
      });
    }).catch(function(e) { status("could not load buckets: " + e, "err"); });
  }

  function loadView() {
    var bucket = $("bucket").value;
    if (!bucket) { status("no bucket selected", "err"); return Promise.resolve(); }
    return fetch("api/view?bucket=" + encodeURIComponent(bucket) + "&page=" + page)
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d) {
        var body = $("rows");
        body.innerHTML = "";
        (d.rows || []).forEach(function(row) {
          var tr = document.createElement("tr");
          var tdd = document.createElement("td");
          var tdk = document.createElement("td");
          var tdv = document.createElement("td");
          tdd.className = "del";
          var trash = $("trashTemplate").content.firstElementChild.cloneNode(true);
          trash.addEventListener("click", function(e) {
            e.stopPropagation(); // the row itself opens the editor; the icon deletes
            deleteKey(bucket, row.key);
          });
          tdd.appendChild(trash);
          tdk.textContent = row.key;
          tdv.textContent = row.value;
          tdk.title = row.key; tdv.title = row.value;
          tr.appendChild(tdd); tr.appendChild(tdk); tr.appendChild(tdv);
          tr.addEventListener("click", function() {
            $("key").value = row.key;
            $("valbox").value = row.value;
            $("valFor").textContent = bucket + " / " + row.key;
            showTab("value");
            if (msgpackMode()) decodeMsgpack();
          });
          body.appendChild(tr);
        });
        $("empty").hidden = (d.rows && d.rows.length > 0);
        $("pageLabel").textContent = "page " + (d.page + 1);
        $("prev").disabled = d.page === 0;
        $("next").disabled = !d.hasNext;
        showTab("data");
        status("");
      })
      .catch(function(e) { status("view failed: " + e, "err"); });
  }

  function loadValue() {
    var bucket = $("bucket").value;
    var key = $("key").value;
    if (!bucket || !key) { status("bucket and key are required", "err"); return; }
    fetch("api/get?bucket=" + encodeURIComponent(bucket) + "&key=" + encodeURIComponent(key))
      .then(function(r) {
        if (r.status === 404) throw new Error("key not found");
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function(d) {
        $("valbox").value = d.value;
        $("valFor").textContent = bucket + " / " + key;
        showTab("value");
        if (msgpackMode()) decodeMsgpack();
        status("");
      })
      .catch(function(e) { status("get failed: " + e, "err"); });
  }

  // Deletes without asking: this is a local admin tool, and a confirm dialog on
  // every row would make clearing a bucket unusable. The row is dropped from the
  // table immediately rather than reloading the page, so the position and the
  // rest of the listing stay put.
  function deleteKey(bucket, key) {
    fetch("api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bucket: bucket, key: key })
    })
      .then(function(r) {
        if (!r.ok) return r.text().then(function(t) { throw new Error(t.trim() || r.status); });
        return r.json();
      })
      // reload first, then report — loadView clears the status line on success
      .then(function() { return loadView(); })
      .then(function() { status("deleted " + bucket + " / " + key, "ok"); })
      .catch(function(e) { status("delete failed: " + e, "err"); });
  }

  function putValue() {
    var bucket = $("bucket").value;
    var key = $("key").value;
    if (!bucket || !key) { status("bucket and key are required", "err"); return; }
    var val = $("valbox").value;
    var mode = document.querySelector('input[name="fmt"]:checked').value;
    if (mode === "msgpack") {
      fetch("api/msgpack/encode", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: val })
      })
        .then(function(r) {
          if (!r.ok) return r.text().then(function(t) { throw new Error(t.trim() || r.status); });
          return r.json();
        })
        .then(function(d) {
          return fetch("api/put", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ bucket: bucket, key: key, value: d.encoded })
          });
        })
        .then(function(r) {
          if (!r.ok) return r.text().then(function(t) { throw new Error(t.trim() || r.status); });
          return r.json();
        })
        .then(function() { status("saved " + bucket + " / " + key, "ok"); })
        .catch(function(e) { status("put failed: " + e, "err"); });
      return;
    }
    fetch("api/put", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bucket: bucket, key: key, value: val })
    })
      .then(function(r) {
        if (!r.ok) return r.text().then(function(t) { throw new Error(t.trim() || r.status); });
        return r.json();
      })
      .then(function() { status("saved " + bucket + " / " + key, "ok"); })
      .catch(function(e) { status("put failed: " + e, "err"); });
  }

  function msgpackMode() {
    return document.querySelector('input[name="fmt"]:checked').value === "msgpack";
  }

  function decodeMsgpack() {
    var val = $("valbox").value;
    if (!val || val.indexOf("hex:") !== 0) return;
    fetch("api/msgpack/decode", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: val })
    })
      .then(function(r) {
        if (!r.ok) return r.text().then(function(t) { throw new Error(t.trim() || r.status); });
        return r.json();
      })
      .then(function(d) {
        $("valbox").value = d.decoded;
        status("");
      })
      .catch(function(e) { status("msgpack decode: " + e, "err"); });
  }

  function onModeChange() {
    if (msgpackMode()) { decodeMsgpack(); } else { loadValue(); }
  }

  function clearBucket() {
    var bucket = $("bucket").value;
    if (!bucket) { status("no bucket selected", "err"); return; }
    if (!confirm("Are you sure you want to clear bucket " + bucket + "?")) return;
    fetch("api/clearbucket", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bucket: bucket })
    })
      .then(function(r) {
        if (!r.ok) return r.text().then(function(t) { throw new Error(t.trim() || r.status); });
        return r.json();
      })
      .then(function(d) { status("cleared bucket " + bucket + " (" + d.deleted + " keys)", "ok"); })
      .then(function() { page = 0; return loadView(); })
      .catch(function(e) { status("clear failed: " + e, "err"); });
  }

  function csvEscape(s) {
    if (s.indexOf('"') === -1 && s.indexOf(',') === -1 && s.indexOf('\n') === -1 && s.indexOf('\r') === -1) return s;
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function exportBucket() {
    var bucket = $("bucket").value;
    if (!bucket) { status("no bucket selected", "err"); return; }
    status("exporting...", "");
    fetch("api/export?bucket=" + encodeURIComponent(bucket))
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d) {
        var lines = ["key,value"];
        (d.rows || []).forEach(function(row) {
          lines.push(csvEscape(row.key) + "," + csvEscape(row.value));
        });
        var csv = lines.join("\n");
        var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = bucket + ".csv";
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
        status("exported " + (d.rows ? d.rows.length : 0) + " keys", "ok");
      })
      .catch(function(e) { status("export failed: " + e, "err"); });
  }

  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (i + 1 < text.length && text[i + 1] === '"') {
            field += '"'; i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ',') {
          row.push(field); field = "";
        } else if (ch === '\n') {
          row.push(field); field = "";
          rows.push(row); row = [];
        } else if (ch !== '\r') {
          field += ch;
        }
      }
    }
    if (field !== "" || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    if (rows.length > 0 && rows[0].length === 2 && rows[0][0] === "key" && rows[0][1] === "value") {
      rows.shift();
    }
    return rows;
  }

  function showImportDialog() {
    var bucket = $("bucket").value;
    if (!bucket) { status("no bucket selected", "err"); return; }
    $("importBucketLabel").textContent = bucket;
    $("importDialog").hidden = false;
  }

  function doImport() {
    var bucket = $("bucket").value;
    var strategy = document.querySelector('input[name="strategy"]:checked').value;
    var file = $("importFileInput").files[0];
    if (!file) { status("no file selected", "err"); return; }
    status("importing...", "");
    var reader = new FileReader();
    reader.onload = function(e) {
      var parsed = parseCSV(e.target.result);
      var rows = [];
      for (var i = 0; i < parsed.length; i++) {
        if (parsed[i].length >= 2) {
          rows.push({ key: parsed[i][0], value: parsed[i][1] });
        }
      }
      fetch("api/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ bucket: bucket, strategy: strategy, rows: rows })
      })
        .then(function(r) {
          if (!r.ok) return r.text().then(function(t) { throw new Error(t.trim() || r.status); });
          return r.json();
        })
        .then(function(d) {
          status("imported " + d.imported + " keys" + (d.skipped ? ", skipped " + d.skipped : ""), "ok");
          page = 0; return loadView();
        })
        .catch(function(e) { status("import failed: " + e, "err"); });
    };
    reader.readAsText(file, "utf-8");
    $("importDialog").hidden = true;
    $("importFileInput").value = "";
  }

  $("view").addEventListener("click", function() { page = 0; loadView(); });
  $("get").addEventListener("click", loadValue);
  $("put").addEventListener("click", putValue);
  document.querySelectorAll('input[name="fmt"]').forEach(function(r) {
    r.addEventListener("change", onModeChange);
  });
  $("prev").addEventListener("click", function() { if (page > 0) { page--; loadView(); } });
  $("next").addEventListener("click", function() { page++; loadView(); });
  $("clearBucket").addEventListener("click", clearBucket);
  $("exportBtn").addEventListener("click", exportBucket);
  $("importBtn").addEventListener("click", showImportDialog);
  $("importCancel").addEventListener("click", function() { $("importDialog").hidden = true; });
  $("importGo").addEventListener("click", function() { $("importFileInput").click(); });
  $("importFileInput").addEventListener("change", doImport);
  $("empty").hidden = false;
  loadBuckets();
</script>
</body>
</html>
